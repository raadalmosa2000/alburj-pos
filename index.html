<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#173f35">
<title>إكسبريس البرج</title>

<style>
:root{
  --primary:#173f35;
  --primary2:#235d4d;
  --accent:#d6a84f;
  --bg:#f4f6f5;
  --card:#fff;
  --text:#18211e;
  --muted:#73807b;
  --border:#e3e8e5;
  --danger:#c94b4b;
  --success:#25835b;
  --shadow:0 8px 30px rgba(20,45,38,.08);
  --radius:20px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  min-height:100vh;
}

.shell{
  min-height:100vh;
  padding-bottom:95px;
}

.container{
  width:min(1180px,calc(100% - 28px));
  margin:auto;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  padding:22px 0 32px;
  box-shadow:0 8px 30px rgba(23,63,53,.18);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#e8c36b,#b8892f);
  color:#173f35;
  font-weight:900;
  font-size:20px;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
  text-align:center;
  line-height:1.05;
}

.brand h1{
  margin:0;
  font-size:24px;
}

.brand p{
  margin:5px 0 0;
  color:#d9e7e1;
  font-size:13px;
}

.date-badge{
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.14);
  padding:10px 14px;
  border-radius:14px;
  font-size:13px;
}

/* PAGE */

.page{
  padding:25px 0;
}

.hero{
  margin-top:-5px;
  background:linear-gradient(135deg,#fff,#f7faf8);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:25px;
  box-shadow:var(--shadow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.hero-label{
  color:var(--muted);
  font-size:14px;
}

.hero h2{
  margin:8px 0;
  font-size:32px;
  color:var(--primary);
}

.hero p{
  margin:0;
  color:var(--muted);
}

.hero-logo{
  width:92px;
  height:92px;
  border-radius:28px;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:var(--accent);
  font-weight:900;
  font-size:23px;
  text-align:center;
  line-height:1.05;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin:20px 0;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}

.stat span,.stat small{
  display:block;
  color:var(--muted);
  font-size:13px;
}

.stat strong{
  display:block;
  margin:8px 0;
  font-size:22px;
  color:var(--primary);
}

/* SECTIONS */

.section{
  margin-top:22px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:13px;
}

.section-head h2,.section-head h3{
  margin:0;
}

.section-head span{
  color:var(--muted);
  font-size:13px;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.quick-card{
  border:1px solid var(--border);
  background:#fff;
  border-radius:20px;
  padding:20px;
  text-align:right;
  box-shadow:var(--shadow);
  transition:.2s;
}

.quick-card:hover{
  transform:translateY(-2px);
  border-color:#cbd9d3;
}

.quick-icon{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:#edf5f1;
  color:var(--primary);
  font-size:23px;
  margin-bottom:13px;
}

.quick-card strong,
.quick-card small{
  display:block;
}

.quick-card small{
  color:var(--muted);
  margin-top:5px;
}

/* CARDS */

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:38px;
  display:block;
  margin-bottom:10px;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:14px;
  min-height:45px;
  padding:10px 16px;
  font-weight:700;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-gold{
  background:var(--accent);
  color:#173f35;
}

.btn-secondary{
  background:#eef3f1;
  color:var(--primary);
}

.btn-danger{
  background:#fff0f0;
  color:var(--danger);
}

.btn-small{
  min-height:37px;
  padding:7px 12px;
  border-radius:11px;
  font-size:13px;
}

/* FORMS */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}

.field input,
.field select,
.search{
  width:100%;
  border:1px solid var(--border);
  background:#fafcfb;
  border-radius:13px;
  padding:12px 13px;
  outline:none;
}

.field input:focus,
.field select:focus,
.search:focus{
  border-color:var(--primary2);
  background:#fff;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:17px;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.toolbar .search{
  flex:1;
}

/* PRODUCTS */

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.product-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  box-shadow:var(--shadow);
}

.product-card h3{
  margin:0 0 8px;
  font-size:16px;
}

.product-price{
  color:var(--primary);
  font-weight:900;
  font-size:18px;
}

.stock{
  margin:10px 0;
  color:var(--muted);
  font-size:13px;
}

.stock.low{
  color:var(--danger);
  font-weight:700;
}

.card-actions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.card-actions button{
  flex:1;
}

/* SALES */

.sale-row,
.customer-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.sale-row:last-child,
.customer-row:last-child{
  border-bottom:0;
}

.sale-info strong,
.sale-info small{
  display:block;
}

.sale-info small{
  color:var(--muted);
  margin-top:5px;
}

.amount{
  font-weight:900;
  color:var(--primary);
  white-space:nowrap;
}

/* SALE */

.sell-layout{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
}

.product-pick-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}

.pick{
  border:1px solid var(--border);
  background:#fff;
  border-radius:15px;
  padding:14px;
  text-align:right;
}

.pick strong,.pick small{
  display:block;
}

.pick small{
  color:var(--muted);
  margin-top:5px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:32px;
  height:32px;
  border:0;
  border-radius:9px;
  background:#edf3f0;
  color:var(--primary);
  font-weight:900;
}

.total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:18px;
  padding-top:17px;
  border-top:2px solid var(--border);
}

.total strong{
  font-size:25px;
  color:var(--primary);
}

/* INVOICE */

.invoice{
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:20px;
  box-shadow:var(--shadow);
}

.invoice-head{
  text-align:center;
  border-bottom:1px dashed #ccc;
  padding-bottom:20px;
}

.invoice-head h1{
  margin:0;
  color:var(--primary);
}

.invoice-meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:20px 0;
  font-size:14px;
}

.invoice-table{
  width:100%;
  border-collapse:collapse;
}

.invoice-table th,
.invoice-table td{
  padding:11px 8px;
  border-bottom:1px solid var(--border);
  text-align:right;
}

.invoice-table th{
  background:#f4f7f5;
}

.invoice-total{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  font-size:20px;
}

/* CUSTOMER */

.customer-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.mini-stat{
  background:#f5f8f6;
  border-radius:13px;
  padding:13px;
}

.mini-stat span,
.mini-stat strong{
  display:block;
}

.mini-stat span{
  color:var(--muted);
  font-size:12px;
}

.mini-stat strong{
  margin-top:5px;
  color:var(--primary);
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:50;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:center;
  gap:5px;
  padding:7px max(10px,calc((100% - 600px)/2));
}

.nav-item{
  flex:1;
  max-width:115px;
  border:0;
  background:transparent;
  color:#7a8580;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.nav-item span{
  font-size:21px;
}

.nav-item small{
  font-size:11px;
}

.nav-item.active{
  color:var(--primary);
  background:#edf5f1;
  font-weight:700;
}

.nav-item.sell{
  color:#fff;
  background:var(--primary);
  margin-top:-20px;
  height:65px;
  border-radius:20px;
  box-shadow:0 8px 22px rgba(23,63,53,.25);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.42);
  display:grid;
  place-items:center;
  padding:18px;
}

.modal-box{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:23px;
  padding:23px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:#f0f3f2;
  width:38px;
  height:38px;
  border-radius:11px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:95px;
  transform:translateX(-50%);
  background:#173f35;
  color:#fff;
  padding:12px 18px;
  border-radius:13px;
  box-shadow:var(--shadow);
  font-size:14px;
}

/* RESPONSIVE */

@media(max-width:900px){
  .stats,
  .quick-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .product-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .sell-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:650px){
  .container{
    width:min(100% - 18px,1180px);
  }

  .header{
    padding-top:16px;
  }

  .brand h1{
    font-size:20px;
  }

  .date-badge{
    display:none;
  }

  .hero{
    padding:19px;
  }

  .hero h2{
    font-size:25px;
  }

  .hero-logo{
    width:70px;
    height:70px;
    border-radius:21px;
    font-size:18px;
  }

  .stats,
  .quick-grid,
  .form-grid{
    grid-template-columns:1fr 1fr;
  }

  .product-grid{
    grid-template-columns:1fr 1fr;
  }

  .product-pick-grid{
    grid-template-columns:1fr 1fr;
  }

  .invoice{
    padding:17px;
  }

  .invoice-meta{
    grid-template-columns:1fr;
  }
}

@media(max-width:430px){
  .stats,
  .quick-grid,
  .form-grid,
  .product-grid{
    grid-template-columns:1fr 1fr;
  }

  .quick-card{
    padding:14px;
  }

  .quick-card strong{
    font-size:14px;
  }

  .quick-card small{
    font-size:11px;
  }

  .product-pick-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media print{
  body{
    background:#fff;
  }

  .no-print,
  .bottom-nav,
  .header{
    display:none!important;
  }

  .shell{
    padding:0;
  }

  .page{
    padding:0;
  }

  .invoice{
    box-shadow:none;
    border:0;
    max-width:none;
  }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================================
   إكسبريس البرج
   نظام نقاط بيع مستقل داخل ملف واحد
========================================================= */

const DB = {
  products: "burj_products_v2",
  sales: "burj_sales_v2",
  customers: "burj_customers_v2",
  daily: "burj_daily_v2"
};

const CURRENCY = "ل.س";

let cart = [];
let currentPage = "home";

const defaultProducts = [
  {id:cryptoId(),name:"عصير برتقال",price:5000,cost:3500,stock:20,minStock:5},
  {id:cryptoId(),name:"مياه معدنية",price:2000,cost:1200,stock:30,minStock:8},
  {id:cryptoId(),name:"بيبسي",price:4000,cost:2800,stock:25,minStock:5},
  {id:cryptoId(),name:"شيبس",price:3500,cost:2300,stock:18,minStock:5},
  {id:cryptoId(),name:"بسكويت",price:3000,cost:1900,stock:20,minStock:5},
  {id:cryptoId(),name:"حليب",price:6000,cost:4300,stock:15,minStock:4}
];

function cryptoId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function load(key,fallback=[]){
  try{
    const value=localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function getProducts(){
  const data=load(DB.products,null);
  if(Array.isArray(data)) return data;
  save(DB.products,defaultProducts);
  return defaultProducts;
}

function getSales(){
  return load(DB.sales,[]);
}

function getCustomers(){
  return load(DB.customers,[]);
}

function money(n){
  return Number(n||0).toLocaleString("ar-SY")+" "+CURRENCY;
}

function num(n){
  return Number(n||0).toLocaleString("ar-SY");
}

function dateText(value){
  return new Date(value).toLocaleDateString("ar-SY");
}

function timeText(value){
  return new Date(value).toLocaleTimeString("ar-SY",{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function monthKey(value=Date.now()){
  const d=new Date(value);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

function toast(message){
  const old=document.querySelector(".toast");
  if(old) old.remove();

  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),2200);
}

function totalSales(sales){
  return sales.reduce((a,s)=>a+Number(s.total||0),0);
}

function todaySales(){
  return getSales().filter(s=>todayKey()===s.dateKey);
}

function customerStats(customerId){
  const sales=getSales().filter(s=>s.customerId===customerId);

  const purchases=sales.reduce((a,s)=>a+Number(s.total||0),0);
  const paid=sales.reduce((a,s)=>a+Number(s.paid||0),0);
  const remaining=sales.reduce((a,s)=>a+Number(s.remaining||0),0);

  const monthly=sales
    .filter(s=>monthKey(s.createdAt)===monthKey())
    .reduce((a,s)=>a+Number(s.total||0),0);

  return {purchases,paid,remaining,monthly,sales};
}

/* =========================================================
   LAYOUT
========================================================= */

function layout(content,active="home"){
  const now=new Date();

  document.getElementById("app").innerHTML=`
    <div class="shell">

      <header class="header">
        <div class="container">
          <div class="header-row">

            <div class="brand">
              <div class="logo">إ<br>ب</div>
              <div>
                <h1>إكسبريس البرج</h1>
                <p>نظام نقاط البيع وإدارة المتجر</p>
              </div>
            </div>

            <div class="date-badge">
              ${now.toLocaleDateString("ar-SY")}
            </div>

          </div>
        </div>
      </header>

      <main class="container page">
        ${content}
      </main>

      ${bottomNav(active)}

    </div>
  `;

  setupNav();
}

function bottomNav(active){
  return `
    <nav class="bottom-nav">

      <button class="nav-item ${active==="home"?"active":""}" data-page="home">
        <span>⌂</span>
        <small>الرئيسية</small>
      </button>

      <button class="nav-item ${active==="sales"?"active":""}" data-page="sales">
        <span>▣</span>
        <small>المبيعات</small>
      </button>

      <button class="nav-item sell ${active==="sell"?"active":""}" data-page="sell">
        <span>＋</span>
        <small>بيع</small>
      </button>

      <button class="nav-item ${active==="products"?"active":""}" data-page="products">
        <span>□</span>
        <small>المنتجات</small>
      </button>

      <button class="nav-item ${active==="customers"?"active":""}" data-page="customers">
        <span>♙</span>
        <small>العملاء</small>
      </button>

    </nav>
  `;
}

function setupNav(){
  document.querySelectorAll("[data-page]").forEach(btn=>{
    btn.onclick=()=>{
      const p=btn.dataset.page;
      if(p==="home") dashboard();
      if(p==="sales") salesPage();
      if(p==="sell") sellPage();
      if(p==="products") productsPage();
      if(p==="customers") customersPage();
    };
  });
}

/* =========================================================
   DASHBOARD
========================================================= */

function dashboard(){
  currentPage="home";

  const sales=getSales();
  const today=todaySales();
  const products=getProducts();

  const todayTotal=totalSales(today);

  const profit=today.reduce((a,s)=>a+Number(s.profit||0),0);

  const stock=products.reduce((a,p)=>a+Number(p.stock||0),0);

  layout(`
    <section class="hero">
      <div>
        <span class="hero-label">مرحبًا بك في</span>
        <h2>إكسبريس البرج</h2>
        <p>إدارة مبيعاتك ومخزونك من مكان واحد.</p>
      </div>

      <div class="hero-logo">
        إكسبريس<br>البرج
      </div>
    </section>

    <section class="stats">

      <div class="stat">
        <span>مبيعات اليوم</span>
        <strong>${money(todayTotal)}</strong>
        <small>إجمالي اليوم</small>
      </div>

      <div class="stat">
        <span>الفواتير</span>
        <strong>${num(today.length)}</strong>
        <small>فاتورة اليوم</small>
      </div>

      <div class="stat">
        <span>الأرباح</span>
        <strong>${money(profit)}</strong>
        <small>تقديري</small>
      </div>

      <div class="stat">

function productModal(id=null){
  const product=id ? getProducts().find(p=>p.id===id) : null;

  modal(`
    <div class="modal-head">
      <h2>${product?"تعديل المنتج":"إضافة منتج"}</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="form-grid">

      <div class="field full">
        <label>اسم المنتج</label>
        <input id="mName" value="${product?escapeAttr(product.name):""}" placeholder="مثال: عصير برتقال">
      </div>

      <div class="field">
        <label>سعر البيع</label>
        <input id="mPrice" type="number" min="0" value="${product?.price||""}">
      </div>

      <div class="field">
        <label>سعر التكلفة</label>
        <input id="mCost" type="number" min="0" value="${product?.cost||""}">
      </div>

      <div class="field">
        <label>كمية المخزون</label>
        <input id="mStock" type="number" min="0" value="${product?.stock??0}">
      </div>

      <div class="field">
        <label>حد التنبيه</label>
        <input id="mMin" type="number" min="0" value="${product?.minStock??5}">
      </div>

    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="saveProduct('${id||""}')">
        حفظ المنتج
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}

function saveProduct(id){
  const name=document.getElementById("mName").value.trim();
  const price=Number(document.getElementById("mPrice").value);
  const cost=Number(document.getElementById("mCost").value);
  const stock=Number(document.getElementById("mStock").value);
  const minStock=Number(document.getElementById("mMin").value);

  if(!name){
    toast("اكتب اسم المنتج");
    return;
  }

  if(price<0 || stock<0){
    toast("تحقق من القيم");
    return;
  }

  const products=getProducts();

  if(id){
    const p=products.find(x=>x.id===id);
    if(p){
      p.name=name;
      p.price=price;
      p.cost=cost;
      p.stock=stock;
      p.minStock=minStock;
    }
  }else{
    products.push({
      id:cryptoId(),
      name,
      price,
      cost,
      stock,
      minStock
    });
  }

  save(DB.products,products);
  closeModal();
  productsPage();
  toast("تم حفظ المنتج ✓");
}

function deleteProduct(id){
  const products=getProducts();
  const p=products.find(x=>x.id===id);

  if(!p) return;

  if(!confirm(`حذف المنتج "${p.name}"؟`)) return;

  save(DB.products,products.filter(x=>x.id!==id));
  productsPage();
  toast("تم حذف المنتج");
}

            <option value="نقدي">نقدي</option>

          </select>
        </div>

        <div class="field" style="margin-top:12px">

  };

  document.getElementById("payment").onchange=()=>{
    const type=document.getElementById("payment").value;
    const total=cartTotal();

    if(type==="نقدي"||type==="بطاقة"){
      document.getElementById("paid").value=total;
    }

    if(type==="آجل"){
      document.getElementById("paid").value=0;
    }
  };

  renderCart();
}

function pickProducts(products){
  if(!products.length){
    return `<div style="grid-column:1/-1" class="empty">لا توجد منتجات</div>`;
  }

  return products.map(p=>`
    <button class="pick" onclick="addCart('${p.id}')">
      <strong>${escapeHtml(p.name)}</strong>
      <small>${money(p.price)}</small>
      <small>المخزون: ${num(p.stock)}</small>
    </button>
  `).join("");
}

function addCart(id){
  const p=getProducts().find(x=>x.id===id);

  if(!p)return;

  if(Number(p.stock)<=0){
    toast("المنتج غير متوفر في المخزون");
    return;
  }

  const item=cart.find(x=>x.id===id);

  if(item){
    if(item.qty>=Number(p.stock)){
      toast("لا توجد كمية إضافية في المخزون");
      return;
    }
    item.qty++;
  }else{
    cart.push({
      id:p.id,
      name:p.name,
      price:Number(p.price),
      cost:Number(p.cost||0),
      qty:1
    });
  }

  renderCart();
}

function cartTotal(){
  return cart.reduce((a,x)=>a+x.price*x.qty,0);
}

function renderCart(){
  const el=document.getElementById("cart");
  if(!el)return;

  const total=cartTotal();
  const count=cart.reduce((a,x)=>a+x.qty,0);

  document.getElementById("cartCount").textContent=num(count)+" قطعة";
  document.getElementById("cartTotal").textContent=money(total);

  if(!cart.length){
    el.innerHTML=`
      <div class="empty">
        <span class="empty-icon">🛒</span>
        السلة فارغة
      </div>
    `;
    return;
  }

  el.innerHTML=cart.map((x,i)=>`
    <div class="cart-item">

      <div>
        <strong>${escapeHtml(x.name)}</strong>
        <div style="color:var(--muted);font-size:12px;margin-top:4px">
          ${money(x.price)} × ${num(x.qty)}
        </div>
      </div>

      <div class="qty">
        <button onclick="changeQty(${i},1)">+</button>
        <strong>${num(x.qty)}</strong>
        <button onclick="changeQty(${i},-1)">−</button>
        <button class="btn btn-danger btn-small" onclick="cart.splice(${i},1);renderCart()">×</button>
      </div>

    </div>
  `).join("");
}

function changeQty(i,delta){
  const item=cart[i];
  const product=getProducts().find(p=>p.id===item.id);

  item.qty+=delta;

  if(item.qty<=0){
    cart.splice(i,1);
  }

  if(product && item.qty>Number(product.stock)){
    item.qty=Number(product.stock);
    toast("وصلت إلى كمية المخزون");
  }

  renderCart();
}

function completeSale(){
  if(!cart.length){
    toast("أضف منتجًا أولًا");
    return;
  }

  const products=getProducts();
  const total=cartTotal();

  const customerId=document.getElementById("saleCustomer").value;
  const customer=getCustomers().find(c=>c.id===customerId);

  const payment=document.getElementById("payment").value;

  let paid=Number(document.getElementById("paid").value||0);

  if(paid<0)paid=0;
  if(paid>total)paid=total;

  if(payment==="نقدي"||payment==="بطاقة"){
    paid=total;
  }

  const remaining=total-paid;

  const profit=cart.reduce((a,x)=>{
    return a+(x.price-x.cost)*x.qty;
  },0);

  const sale={
    id:cryptoId(),
    invoiceNumber:"INV-"+Date.now(),
    createdAt:new Date().toISOString(),
    dateKey:todayKey(),
    customerId:customerId||null,
    customerName:customer?.name||"عميل نقدي",
    paymentMethod:payment,
    total,
    paid,
    remaining,
    profit,
    items:cart.map(x=>({
      id:x.id,
      name:x.name,
      qty:x.qty,
      price:x.price,
      cost:x.cost,
      subtotal:x.price*x.qty
    }))
  };

  // خصم المخزون
  cart.forEach(item=>{
    const p=products.find(x=>x.id===item.id);
    if(p){
      p.stock=Math.max(0,Number(p.stock)-Number(item.qty));
    }
  });

  save(DB.products,products);

  const sales=getSales();
  sales.push(sale);
  save(DB.sales,sales);

  cart=[];

  toast("تم حفظ الفاتورة ✓");

  setTimeout(()=>showInvoice(sale),300);
}

  `,"sales");

  document.getElementById("salesSearch").oninput=e=>{
    const q=e.target.value.trim().toLowerCase();

    const filtered=getSales().filter(s=>{
      const text=[
        s.invoiceNumber,
        s.customerName,
        s.paymentMethod,
        ...s.items.map(i=>i.name)
      ].join(" ").toLowerCase();

      return text.includes(q);
    });

    document.getElementById("salesList").innerHTML=salesHTML(filtered);
  };
}

function salesHTML(sales){
  if(!sales.length){
    return `<div class="empty"><span class="empty-icon">🧾</span>لا توجد فواتير</div>`;
  }

  return sales.slice().reverse().map(s=>`
    <div class="sale-row" onclick="openInvoice('${s.id}')" style="cursor:pointer">

      <div class="sale-info">
        <strong>${escapeHtml(s.invoiceNumber)}</strong>
        <small>${dateText(s.createdAt)} - ${timeText(s.createdAt)}</small>
        <small>${escapeHtml(s.customerName)} · ${escapeHtml(s.paymentMethod)}</small>
      </div>

      <div>
        <div class="amount">${money(s.total)}</div>
        ${
          s.remaining>0
          ? `<small style="color:var(--danger)">باقي ${money(s.remaining)}</small>`
          : `<small style="color:var(--success)">مدفوع ✓</small>`
        }
      </div>

    </div>
  `).join("");
}

/* =========================================================
   INVOICE
========================================================= */

function openInvoice(id){
  const sale=getSales().find(s=>s.id===id);
  if(sale)showInvoice(sale);
}

function showInvoice(sale){
  layout(`
    <div class="invoice">

      <div class="invoice-head">
        <h1>إكسبريس البرج</h1>
        <p>فاتورة بيع</p>
        <small>الليرة السورية</small>
      </div>

      <div class="invoice-meta">
        <div><strong>رقم الفاتورة:</strong> ${escapeHtml(sale.invoiceNumber)}</div>
        <div><strong>التاريخ:</strong> ${dateText(sale.createdAt)}</div>
        <div><strong>الوقت:</strong> ${timeText(sale.createdAt)}</div>
        <div><strong>العميل:</strong> ${escapeHtml(sale.customerName)}</div>
        <div><strong>الدفع:</strong> ${escapeHtml(sale.paymentMethod)}</div>
      </div>

      <table class="invoice-table">
        <thead>
          <tr>
            <th>المنتج</th>
            <th>الكمية</th>
            <th>السعر</th>
            <th>المجموع</th>
          </tr>
        </thead>

        <tbody>
          ${sale.items.map(i=>`
            <tr>
              <td>${escapeHtml(i.name)}</td>
              <td>${num(i.qty)}</td>
              <td>${num(i.price)}</td>
              <td>${num(i.subtotal)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>

      <div class="invoice-total">
        <span>الإجمالي</span>
        <strong>${money(sale.total)}</strong>
      </div>

      <div class="invoice-total" style="font-size:15px">
        <span>المدفوع</span>
        <strong>${money(sale.paid)}</strong>
      </div>

      <div class="invoice-total" style="font-size:15px">
        <span>الباقي</span>
        <strong style="color:${sale.remaining?"var(--danger)":"var(--success)"}">
          ${money(sale.remaining)}
        </strong>
      </div>

      <div class="actions no-print">
        <button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button>
        <button class="btn btn-secondary" onclick="salesPage()">📋 المبيعات</button>
        <button class="btn btn-gold" onclick="sellPage()">＋ بيع جديد</button>
        <button class="btn btn-secondary" onclick="dashboard()">⌂ الرئيسية</button>
      </div>

    </div>
  `,"sales");
}

/* =========================================================
   RESET DAILY
========================================================= */

function resetDaily(){
  const today=todaySales();

  if(!today.length){
    toast("لا توجد حسابات لليوم");
    return;
  }

  const total=totalSales(today);

  const ok=confirm(
    "سيتم تصفير ملخص الحسابات اليومية فقط.\n\n"+
    "عدد الفواتير: "+today.length+"\n"+
    "إجمالي المبيعات: "+money(total)+"\n\n"+
    "الفواتير الأصلية لن تُحذف.\nهل تريد المتابعة؟"
  );

  if(!ok)return;

  save(DB.daily,{
    date:todayKey(),
    closedAt:new Date().toISOString(),
    invoices:today.length,
    total
  });

  toast("تم إغلاق الحسابات اليومية ✓");
}

/* =========================================================
   MODAL
========================================================= */

function modal(html){
  const old=document.querySelector(".modal");
  if(old)old.remove();

  const el=document.createElement("div");
  el.className="modal";
  el.innerHTML=`<div class="modal-box">${html}</div>`;
  document.body.appendChild(el);
}

function closeModal(){
  document.querySelector(".modal")?.remove();
}

/* =========================================================
   SECURITY / TEXT
========================================================= */

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

/* =========================================================
   START
========================================================= */

if(!localStorage.getItem(DB.products)){
  save(DB.products,defaultProducts);
}

dashboard();

</script>
